<!DOCTYPE html>
<html lang="fr">
<head>
 <meta charset="UTF-8">
 <meta name="viewport" content="width=device-width, initial-scale=1.0">
 <title>Chat Vocal</title>
 <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&amp;display=swap" rel="stylesheet">
 <style>
   :root {
     --bg:          #191919;
     --bg2:         #191919;
     --bg3:         #131313;
     --header:      #131313;
     --border:      #333333;
     --border2:     #323232;
     --green:       #81ac7b;
     --green-dim:   #6c8069;
     --red:         #975a5a;
     --red-dim:     #633c3c;
     --amber:       #a99364;
     --text:        #edecec;
     --text-dim:    #bdbdbd;
     --text-bright: #e7e7e7;
   }

   * { margin: 0; padding: 0; box-sizing: border-box; }

   body {
     font-family: 'Inter', sans-serif;
     background: var(--bg);
     color: var(--text);
     min-height: 100vh;
     display: flex;
     flex-direction: column;
   }

   header {
     flex-shrink: 0;
     display: flex;
     align-items: center;
     gap: 16px;
     padding: 16px 28px;
     border-bottom: 1px solid var(--border);
     background: var(--header);
   }

   .header-title { flex: 1; }
   .header-title h1 {
     font-size: 18px; font-weight: 600; letter-spacing: 2px;
     color: var(--text-bright); text-transform: uppercase;
   }
   .header-title p {
     font-size: 11px; color: var(--text-dim); letter-spacing: 1px;
     text-transform: uppercase; margin-top: 2px;
   }

   .header-status {
     font-size: 11px; letter-spacing: 1px;
     display: flex; align-items: center; gap: 6px;
     color: var(--text-dim);
   }
   .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--text-dim); }
   .dot.green { background: var(--green); }
   .dot.red   { background: var(--red); }

   .page-section { display: flex; flex-direction: column; flex: 1; }
   .page-section.hidden { display: none; }

   #page-connexion {
     align-items: center;
     justify-content: center;
     padding: 28px 20px;
   }

   #page-connexion .panel {
     width: 100%;
     max-width: 520px;
   }

   .panel {
     background: var(--bg2);
     border: 1px solid var(--border);
     border-radius: 6px;
     overflow: hidden;
   }

   .panel-header {
     flex-shrink: 0;
     display: flex;
     align-items: center;
     gap: 10px;
     padding: 12px 16px;
     border-bottom: 1px solid var(--border);
     background: var(--bg3);
   }
   .panel-header span {
     font-size: 12px; font-weight: 600; letter-spacing: 1px;
     text-transform: uppercase; color: var(--text-dim);
   }

   .panel-body { padding: 16px; text-align: center; }

   .btn {
     display: flex; align-items: center; justify-content: center; gap: 8px;
     width: 100%; padding: 10px 16px;
     border: 1px solid var(--border2); border-radius: 4px;
     background: var(--bg3); color: var(--text);
     font-family: 'Inter', sans-serif; font-size: 13px;
     font-weight: 500; letter-spacing: 0.5px;
     cursor: pointer; transition: all 0.15s; margin-bottom: 8px;
   }
   .btn:hover:not(:disabled) { background: #2a2a2a; color: var(--text-bright); border-color: #666; }
   .btn:disabled { opacity: 0.35; cursor: not-allowed; }
   .btn.green { border-color: var(--green-dim); color: var(--green); background: rgba(74,158,63,0.08); }
   .btn.green:hover:not(:disabled) { background: rgba(74,158,63,0.15); }
   .btn.amber { border-color: #5a4a1e; color: #c09840; background: rgba(158,122,46,0.08); }
   .btn.amber:hover:not(:disabled) { border-color: #7a6a2e; color: #d4ac50; background: rgba(158,122,46,0.15); }

   .input-text {
     width: 100%; padding: 9px 12px; margin-bottom: 8px;
     background: var(--bg3); border: 1px solid var(--border2);
     border-radius: 4px; color: var(--text-bright);
     font-family: 'Inter', sans-serif; font-size: 13px;
     outline: none; text-align: center;
   }
   .input-text:focus { border-color: #555; }

   .audio-label {
     font-size: 11px; font-weight: 600; letter-spacing: 1px;
     text-transform: uppercase; color: var(--text-dim);
     margin-bottom: 8px; display: block;
   }

   .auth-user {
     display: none; align-items: center; gap: 10px; padding: 10px 12px;
     background: rgba(74,158,63,0.07); border: 1px solid rgba(74,158,63,0.2);
     border-radius: 4px; margin: 12px 0 10px 0;
   }
   .auth-user-info { flex: 1; }
   .auth-user-name { font-size: 13px; font-weight: 600; color: var(--text-bright); }
   .auth-user-sub  { font-size: 10px; color: var(--green); letter-spacing: 0.5px; margin-top: 2px; }

   .master-vol { display: flex; align-items: center; gap: 10px; margin-bottom: 12px; }
   .master-vol label { font-size: 11px; color: var(--text-dim); min-width: 50px; }

   input[type=range] {
     flex: 1; -webkit-appearance: none; height: 3px;
     background: var(--border2); border-radius: 2px; outline: none; cursor: pointer;
   }
   input[type=range]::-webkit-slider-thumb {
     -webkit-appearance: none; width: 12px; height: 12px;
     border-radius: 50%; background: var(--text); cursor: pointer;
   }

   .vol-value { font-size: 11px; color: var(--text-dim); min-width: 34px; text-align: right; }

   .check-row {
     display: flex; align-items: center; gap: 8px;
     font-size: 12px; color: var(--text-dim);
     cursor: pointer; padding: 4px 0;
   }
   .check-row input[type=checkbox] {
     accent-color: var(--green); width: 13px; height: 13px; cursor: pointer;
   }

   #joueurs-liste {
     display: flex;
     flex-direction: column;
     gap: 6px;
     flex: 1;
     min-height: 0;
     overflow-y: auto;
     padding-right: 4px;
   }

   .empty-state {
     text-align: center; padding: 40px 20px;
     font-size: 13px; color: var(--text-dim); line-height: 1.8;
   }

   .joueur-card {
     flex-shrink: 0;
     background: var(--bg3); border: 1px solid var(--border);
     border-radius: 4px; padding: 10px 14px;
   }

   .joueur-top { display: flex; align-items: center; gap: 10px; margin-bottom: 8px; }
   .joueur-meta { flex: 1; min-width: 0; }
   .joueur-nom {
     font-size: 13px; font-weight: 600; color: var(--text-bright);
   }

   .joueur-vol-slider { display: flex; align-items: center; gap: 6px; margin-top: 6px; }
   .joueur-vol-slider label { font-size: 10px; color: var(--text-dim); min-width: 42px; }
   .joueur-vol-slider input[type=range] { flex: 1; }
   .joueur-vol-slider .vol-value { font-size: 10px; min-width: 28px; }

   .btn-mute {
     padding: 3px 8px; background: transparent;
     border: 1px solid var(--border2); border-radius: 3px;
     color: var(--text-dim); font-family: 'Inter', sans-serif;
     font-size: 11px; font-weight: 500; cursor: pointer;
     transition: all 0.15s; flex-shrink: 0;
   }
   .btn-mute:hover { border-color: var(--red-dim); color: #c97070; }
   .btn-mute.muted { border-color: var(--red-dim); color: #c97070; background: rgba(158,63,63,0.1); }

   #log {
     flex-shrink: 0;
     font-size: 11px; color: var(--text-dim); letter-spacing: 0.3px;
     margin-top: 10px; padding: 8px 10px;
     background: var(--bg3); border: 1px solid var(--border);
     border-radius: 4px; min-height: 28px;
   }

   #page-principale {
     overflow: hidden;
   }

   #page-principale > main {
     flex: 1;
     min-height: 0;
     max-width: 960px;
     width: 100%;
     margin: 0 auto;
     padding: 28px 20px;
     display: grid;
     grid-template-columns: 280px 1fr;
     gap: 20px;
     height: calc(100vh - 75px);
     overflow: hidden;
   }

   @media (max-width: 640px) {
     #page-principale > main {
       grid-template-columns: 1fr;
       height: auto;
       overflow: visible;
     }
   }

   .left-col {
     display: flex;
     flex-direction: column;
     gap: 20px;
     min-height: 0;
     overflow: hidden;
   }

   .right-col {
     display: flex;
     flex-direction: column;
     min-height: 0;
     overflow: hidden;
   }

   .right-col.panel {
     display: flex;
     flex-direction: column;
     flex: 1;
     min-height: 0;
   }

   .right-col .panel-body {
     display: flex;
     flex-direction: column;
     flex: 1;
     min-height: 0;
     padding: 12px !important;
     overflow: hidden;
   }
 </style>
</head>
<body>

<header>
 <div class="header-title">
   <h1>Chat Vocal</h1>
   <p>Système Audio</p>
 </div>
 <div class="header-status">
   <div class="dot" id="dot-serveur"></div>
   <span id="statut-txt">Hors ligne</span>
 </div>
</header>

<div id="page-connexion" class="page-section">
 <div class="panel" style="width:100%; max-width:520px;">
   <div class="panel-header"><span>Connexion</span></div>
   <div class="panel-body">
     <p style="margin-bottom:16px; color:var(--text-dim); font-size:13px; line-height:1.7;">
       Entrez votre pseudo pour accéder au chat vocal.
     </p>
     <label class="audio-label" style="margin-bottom:6px;">Pseudo</label>
     <input
       type="text"
       id="input-pseudo"
       class="input-text"
       placeholder="ENTRER VOTRE PSEUDONYME"
       maxlength="30"
       onkeydown="if(event.key==='Enter') verifierPseudo()"
     >
     <button class="btn" id="btn-verifier" onclick="verifierPseudo()">
       <span id="btn-verifier-txt">VALIDER ET CONTINUER</span>
     </button>
   </div>
 </div>
</div>

<div id="page-principale" class="page-section hidden">
 <main>

   <div class="left-col">

     <div class="panel">
       <div class="panel-header"><span>Connexion</span></div>
       <div class="panel-body">
         <button class="btn green" id="btn-rejoindre" disabled onclick="rejoindrVocal()">
           Se connecter au vocal
         </button>
         <button class="btn amber" id="btn-quitter" disabled onclick="quitterVocal()">
           Se déconnecter du vocal
         </button>
         <div class="auth-user" id="auth-user">
           <div class="auth-user-info">
             <div class="auth-user-name" id="auth-nom">—</div>
             <div class="auth-user-sub">Connecté</div>
           </div>
         </div>
       </div>
     </div>

     <div class="panel">
       <div class="panel-header"><span>Contrôles Audio</span></div>
       <div class="panel-body">
         <span class="audio-label">Microphone</span>
         <button class="btn amber" id="micro-btn" disabled onclick="toggleMicro()">
           Microphone désactivé
         </button>
         <div style="margin-top:16px">
           <span class="audio-label">Volume général</span>
           <div class="master-vol">
             <label>Sortie</label>
             <input type="range" id="master-vol" min="0" max="100" value="100"
                    oninput="setMasterVol(this.value)">
             <span class="vol-value" id="master-vol-val">100%</span>
           </div>
         </div>
         <label class="check-row">
           <input type="checkbox" id="mute-all" onchange="muteAll(this.checked)">
           Muter tous les joueurs
         </label>
       </div>
     </div>

   </div>

   <div class="panel right-col">
     <div class="panel-header">
       <span id="header-joueurs">Joueurs connectés : 0</span>
     </div>
     <div class="panel-body">
       <div id="joueurs-liste">
         <div class="empty-state">Aucune session active<br>En attente de connexion</div>
       </div>
       <div id="log">Système prêt</div>
     </div>
   </div>

 </main>
</div>

<footer style="
 position: fixed; bottom: 12px; left: 16px;
 font-size: 10px; color: var(--text-dim); letter-spacing: 0.5px;
">Système de chat vocal</footer>

<script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
<script>
let monNom         = null;
let socket         = null;
let streamLocal    = null;
let audioCtx       = null;
let masterGainNode = null;
let microActif     = false;
let dansLeVocal    = false;
let iceServers     = [{ urls: 'stun:stun.l.google.com:19302' }];

const peerConnections = {};
const audioElements   = {};
const audioSources    = {};
const mutesLocaux     = {};
const volsLocaux      = {};
let dernierPeersConnus = [];
const senders = {};
let volMaster = 1;

async function verifierPseudo() {
 const input = document.getElementById('input-pseudo');
 const nom   = input.value.trim();
 if (!nom) return;

 const btn = document.getElementById('btn-verifier');
 const txt = document.getElementById('btn-verifier-txt');
 btn.disabled = true;
 txt.textContent = 'Vérification…';

 try {
   const res  = await fetch('/verifier-pseudo', {
     method: 'POST',
     headers: { 'Content-Type': 'application/json' },
     body: JSON.stringify({ nom })
   });
   const data = await res.json();

   if (!data.ok) {
     log('Erreur : ' + data.erreur);
     btn.disabled = false;
     txt.textContent = 'VALIDER ET CONTINUER';
     return;
   }

   monNom = data.nomExact || nom;

   document.getElementById('page-connexion').classList.add('hidden');
   document.getElementById('page-principale').classList.remove('hidden');

   const authDiv = document.getElementById('auth-user');
   authDiv.style.display = 'flex';
   document.getElementById('auth-nom').textContent = monNom;

   document.getElementById('btn-rejoindre').disabled = false;
   log('Compte vérifié : ' + monNom);

 } catch (e) {
   log('Erreur réseau : ' + e.message);
   btn.disabled = false;
   txt.textContent = 'VALIDER ET CONTINUER';
 }
}

async function chargerIceServers() {
 try {
   const res  = await fetch('/turn-credentials');
   const data = await res.json();
   if (data.iceServers && data.iceServers.length) {
     iceServers = data.iceServers;
   }
 } catch (e) {
   console.warn('[ICE] Erreur:', e.message);
 }
}

async function rejoindrVocal() {
 if (!monNom) return;

 await chargerIceServers();

 const CtxAudio = window.AudioContext || window.webkitAudioContext;
 audioCtx = new CtxAudio();
 masterGainNode = audioCtx.createGain();
 masterGainNode.gain.value = 1;
 masterGainNode.connect(audioCtx.destination);

 try {
   streamLocal = await navigator.mediaDevices.getUserMedia({
     audio: { echoCancellation: true, noiseSuppression: true, autoGainControl: true },
     video: false
   });
   streamLocal.getAudioTracks().forEach(t => t.enabled = false);
   log('Micro prêt');
 } catch (e) {
   log('Micro inaccessible : ' + e.message);
   return;
 }

 dansLeVocal = true;
 document.getElementById('btn-rejoindre').disabled = true;
 document.getElementById('btn-quitter').disabled   = false;
 document.getElementById('micro-btn').disabled     = false;

 connecterServeur();
}

function quitterVocal() {
 dansLeVocal = false;
 Object.keys(peerConnections).forEach(fermerPeer);

 if (streamLocal) {
   streamLocal.getTracks().forEach(t => t.stop());
   streamLocal = null;
 }

 if (audioCtx) {
   audioCtx.close();
   audioCtx = null;
   masterGainNode = null;
 }

 if (socket) {
   socket.disconnect();
   socket = null;
 }

 document.getElementById('btn-rejoindre').disabled = false;
 document.getElementById('btn-quitter').disabled   = true;
 document.getElementById('micro-btn').disabled     = true;
 document.getElementById('micro-btn').textContent  = 'Microphone désactivé';
 document.getElementById('micro-btn').className    = 'btn amber';
 microActif = false;

 setStatut('offline');
 log('Déconnecté du vocal');
 document.getElementById('joueurs-liste').innerHTML =
   '<div class="empty-state">Session terminée</div>';
 mettreAJourCompteur();
}

document.addEventListener('visibilitychange', () => {
 if (!audioCtx) return;
 if (audioCtx.state === 'suspended') {
   audioCtx.resume();
 }
});

function toggleMicro() {
 if (!streamLocal) return;
 microActif = !microActif;
 streamLocal.getAudioTracks().forEach(t => t.enabled = microActif);
 const btn = document.getElementById('micro-btn');
 btn.textContent = microActif ? 'Microphone actif' : 'Microphone désactivé';
 btn.className   = microActif ? 'btn green' : 'btn amber';
}

function setMasterVol(v) {
 document.getElementById('master-vol-val').textContent = v + '%';
 volMaster = v / 100;
 if (masterGainNode) masterGainNode.gain.value = volMaster;
 appliquerTousLesVolumes();
}

function muteAll(muted) {
 for (const nom in audioElements) appliquerVolumeJoueur(nom);
 log(muted ? 'Tous les joueurs mutés' : 'Son restauré');
}

function toggleMuteJoueur(nom) {
 mutesLocaux[nom] = !mutesLocaux[nom];
 appliquerVolumeJoueur(nom);
 const btn  = document.getElementById('mute-' + nom);
 const card = document.getElementById('card-' + nom);
 if (btn)  { btn.textContent = mutesLocaux[nom] ? 'Unmute' : 'Mute'; btn.classList.toggle('muted', mutesLocaux[nom]); }
 if (card) card.classList.toggle('muted', mutesLocaux[nom]);
}

function setVolJoueur(nom, v) {
 volsLocaux[nom] = Number(v);
 const el = document.getElementById('volval-' + nom);
 if (el) el.textContent = v + '%';
 appliquerVolumeJoueur(nom);
}

function appliquerVolumeJoueur(nom) {
 const audio = audioElements[nom];
 if (!audio) return;
 const muted      = mutesLocaux[nom] || document.getElementById('mute-all')?.checked;
 const volLocal   = (volsLocaux[nom] ?? 100) / 100;
 const vol = muted ? 0 : volLocal * volMaster;
 if (audioSources[nom]) {
   audioSources[nom].gain.gain.value = vol;
 }
}

function appliquerTousLesVolumes() {
 for (const nom in audioElements) appliquerVolumeJoueur(nom);
}

function connecterServeur() {
 socket = io();

 socket.on('connect', () => {
   setStatut('online');
   socket.emit('rejoindre', { nom: monNom });
   log('Connecté');
 });

 socket.on('joueur-valide', () => {
   log('Validé — vocal actif');
 });

 socket.on('disconnect', () => setStatut('offline'));

 socket.on('peers-actifs', (nomsActifs) => {
   if (!Array.isArray(nomsActifs)) return;
   dernierPeersConnus = nomsActifs.slice();
   console.log('[PEERS] liste serveur :', nomsActifs.join(', ') || '(vide)');

   for (const nom in peerConnections) {
     if (!nomsActifs.includes(nom)) fermerPeer(nom);
   }
   for (const nom of nomsActifs) {
     if (!peerConnections[nom] && nom !== monNom) {
       if (monNom < nom) creerPeer(nom, true);
     }
   }
 });

 socket.on('signal', ({ de, signal }) => traiterSignal(de, signal));

 socket.on('joueur-parti', ({ nom }) => {
   log(nom + ' est parti');
   fermerPeer(nom);
   dernierPeersConnus = dernierPeersConnus.filter(n => n !== nom);
   const card = document.getElementById('card-' + nom);
   if (card) card.remove();
   mettreAJourCompteur();
 });

 socket.on('force-deconnexion', ({ raison }) => {
   alert('Déconnecté du vocal : ' + raison);
   quitterVocal();
 });

 socket.on('players:all', (players) => {
   const webPlayers = players.filter(p => p.source === 'web');
   const gamePlayers = players.filter(p => p.source === 'game');
   log('Joueurs en jeu : ' + gamePlayers.map(p => p.username).join(', ') || 'Aucun');
   log('Joueurs web : ' + webPlayers.map(p => p.username).join(', ') || 'Aucun');

   // Mettre à jour la liste des peers actifs avec les joueurs web
   const nomsActifs = webPlayers.map(p => p.username);
   dernierPeersConnus = nomsActifs.slice();

   // Gérer les connexions WebRTC
   for (const nom in peerConnections) {
     if (!nomsActifs.includes(nom)) fermerPeer(nom);
   }
   for (const nom of nomsActifs) {
     if (!peerConnections[nom] && nom !== monNom) {
       if (monNom < nom) creerPeer(nom, true);
     }
   }
 });
}

function creerPeer(nomJoueur, initiateur) {
 if (peerConnections[nomJoueur]) return;

 const pc = new RTCPeerConnection({ iceServers });
 peerConnections[nomJoueur] = pc;

 pc.oniceconnectionstatechange = () => {
   console.log(`[ICE] ${nomJoueur} : ${pc.iceConnectionState}`);
 };

 if (streamLocal) {
   const piste = streamLocal.getAudioTracks()[0];
   if (piste) senders[nomJoueur] = pc.addTrack(piste, streamLocal);
 }

 pc.ontrack = (event) => {
   if (!audioElements[nomJoueur]) {
     const audio = new Audio();
     audio.autoplay = true;
     audio.muted = false;
     document.body.appendChild(audio);
     audioElements[nomJoueur] = audio;
     volsLocaux[nomJoueur]  = 100;
     mutesLocaux[nomJoueur] = false;
   }

   const audioEl = audioElements[nomJoueur];
   audioEl.srcObject = event.streams[0];
   const lecture = audioEl.play();
   if (lecture && lecture.catch) lecture.catch(() => {});

   if (audioSources[nomJoueur]) {
     try { audioSources[nomJoueur].source.disconnect(); audioSources[nomJoueur].gain.disconnect(); } catch (e) {}
   }
   if (audioCtx) {
     const source = audioCtx.createMediaStreamSource(event.streams[0]);
     const gain   = audioCtx.createGain();
     gain.gain.value = 1;
     source.connect(gain);
     gain.connect(audioCtx.destination);
     audioSources[nomJoueur] = { source, gain };
   }
   appliquerVolumeJoueur(nomJoueur);
   log('Audio reçu de ' + nomJoueur);
   ajouterJoueurInterface(nomJoueur);
 };

 pc.onicecandidate = (e) => {
   if (e.candidate) {
     socket.emit('signal', {
       pour: nomJoueur, de: monNom,
       signal: { type: 'ice', candidate: e.candidate }
     });
   }
 };

 if (initiateur) {
   pc.createOffer()
     .then(offer => {
       pc.setLocalDescription(offer);
       socket.emit('signal', {
         pour: nomJoueur, de: monNom,
         signal: { type: 'offer', sdp: offer }
       });
     })
     .catch(e => console.error('[WebRTC] createOffer :', e));
 }
}

async function traiterSignal(de, signal) {
 if (!peerConnections[de]) creerPeer(de, false);
 const pc = peerConnections[de];
 try {
   if (signal.type === 'offer') {
     await pc.setRemoteDescription(new RTCSessionDescription(signal.sdp));
     const answer = await pc.createAnswer();
     await pc.setLocalDescription(answer);
     socket.emit('signal', {
       pour: de, de: monNom,
       signal: { type: 'answer', sdp: answer }
     });
   } else if (signal.type === 'answer') {
     await pc.setRemoteDescription(new RTCSessionDescription(signal.sdp));
   } else if (signal.type === 'ice') {
     if (pc.remoteDescription) {
       await pc.addIceCandidate(new RTCIceCandidate(signal.candidate));
     } else {
       console.warn('[WebRTC] ICE reçu avant description distante, ignoré');
     }
   }
 } catch (e) {
   console.error('[WebRTC] traiterSignal :', e);
 }
}

function fermerPeer(nom) {
 if (peerConnections[nom]) {
   try {
     peerConnections[nom].oniceconnectionstatechange = null;
     peerConnections[nom].close();
   } catch (e) {}
   delete peerConnections[nom];
 }
 delete senders[nom];
 if (audioElements[nom]) {
   try { audioElements[nom].srcObject = null; } catch (e) {}
   audioElements[nom].remove();
   delete audioElements[nom];
 }
 if (audioSources[nom]) {
   try { audioSources[nom].source.disconnect(); audioSources[nom].gain.disconnect(); } catch (e) {}
   delete audioSources[nom];
 }
}

function ajouterJoueurInterface(nom) {
 const liste = document.getElementById('joueurs-liste');
 if (document.getElementById('card-' + nom)) return;

 const card = document.createElement('div');
 card.className = 'joueur-card';
 card.id = 'card-' + nom;
 card.innerHTML = `
   <div class="joueur-top">
     <div class="joueur-meta">
       <div class="joueur-nom">${nom}</div>
     </div>
     <button class="btn-mute" id="mute-${nom}" onclick="toggleMuteJoueur('${nom}')">Mute</button>
   </div>
   <div class="joueur-vol-slider">
     <label>Volume</label>
     <input type="range" min="0" max="200" value="100"
            oninput="setVolJoueur('${nom}', this.value)">
     <span class="vol-value" id="volval-${nom}">100%</span>
   </div>
 `;
 liste.appendChild(card);
 mettreAJourCompteur();
}

function mettreAJourCompteur() {
 const nb = document.querySelectorAll('.joueur-card').length;
 document.getElementById('header-joueurs').textContent = 'Joueurs connectés : ' + nb;
}

function setStatut(etat) {
 document.getElementById('dot-serveur').className   = 'dot ' + (etat === 'online' ? 'green' : 'red');
 document.getElementById('statut-txt').textContent  = etat === 'online' ? 'En ligne' : 'Hors ligne';
}

function log(msg) {
 document.getElementById('log').textContent = msg;
}
</script>
